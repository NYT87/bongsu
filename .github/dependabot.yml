# Weekly dependency updates, grouped so each ecosystem opens few pull requests a week. Commit messages follow
# Conventional Commits (commitlint.config.js): chore(deps) for npm and Docker, ci(deps) for the workflows' actions.
version: 2
updates:
  - package-ecosystem: npm # pnpm workspaces: Dependabot reads pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      npm-dev:
        dependency-type: development
        update-types: [minor, patch]
      npm-prod:
        dependency-type: production
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      docker:
        patterns: ["*"]
