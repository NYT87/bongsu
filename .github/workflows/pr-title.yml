# The pull request title follows Conventional Commits too (commitlint.config.js): squashing uses it as the commit
# message. Runs again when the title is edited.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  commitlint:
    # Dependabot's titles start with "Bump", which subject-case refuses; its prefix (chore(deps), ci(deps)) is set in
    # dependabot.yml, and CI skips its commits the same way
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - env:
          TITLE: ${{ github.event.pull_request.title }} # through the environment, never into the script
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint --verbose
