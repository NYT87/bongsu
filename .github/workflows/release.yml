# Releases from main with Changesets (docs/development.md, "Releases and changelogs"):
# - with pending changesets, opens or updates the "Version Packages" pull request (versions + each CHANGELOG.md);
# - once that is merged, tags the new versions, creates their GitHub releases, publishes the packages that aren't
#   private (the CLI, `bongsu`, on npm with provenance) and, when the product's version moved, pushes the Docker image
#   to GHCR.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the version commit, tags and GitHub releases
      pull-requests: write # the Version Packages pull request
      id-token: write # npm trusted publishing (OIDC) and provenance: no npm token is stored
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      packages: ${{ steps.changesets.outputs.published-packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10, Node 24 ships npm 11. No registry-url: it
      # writes an .npmrc with a token placeholder that stands in the way of the OIDC exchange.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # The CLI is published as its bundle (packages/cli/build.mjs); the other packages publish nothing.
      - run: pnpm --filter bongsu build
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset version
          publish-script: sh scripts/release-publish.sh # the CLI with npm, then a git tag per new version
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      # One GitHub release per package, and GitHub marks the one created last as Latest (often @bongsu/schema): point
      # it at the CLI's release, else the product's (@bongsu/core).
      - if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          tag="$(jq -r 'map(select(.name == "bongsu" or .name == "@bongsu/core")) | sort_by(.name != "bongsu") | first
            | if . then "\(.name)@\(.version)" else empty end' <<<"$PACKAGES")"
          if [ -n "$tag" ]; then gh release edit "$tag" --latest -R "$GITHUB_REPOSITORY"; fi

  # The Node image (Dockerfile) at the product's version, when any package of the fixed group (.changeset/config.json)
  # got its tag in this run; they share @bongsu/core's version.
  docker:
    needs: release
    if: >-
      needs.release.outputs.published == 'true' && (contains(needs.release.outputs.packages, '"@bongsu/core"') ||
      contains(needs.release.outputs.packages, '"@bongsu/api"') ||
      contains(needs.release.outputs.packages, '"@bongsu/cloudflare"') ||
      contains(needs.release.outputs.packages, '"@bongsu/web"') ||
      contains(needs.release.outputs.packages, '"@bongsu/dashboard"'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the product's version, from the commit being released (core may have been tagged by an earlier run)
      - id: version
        run: echo "version=$(jq -r .version packages/core/package.json)" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
