# Releases from main with Changesets (docs/development.md, "Releases and changelogs"):
# - with pending changesets, opens or updates the "Version Packages" pull request (versions + each CHANGELOG.md);
# - once that is merged, tags the new versions, creates their GitHub releases, publishes the packages that aren't
#   private (the CLI, `bongsu`, on npm with provenance) and, when the product's version moved, pushes the Docker image
#   to GHCR and, where the repository turns it on (vars.CLOUDFLARE_DEPLOY), deploys the Cloudflare Workers
#   (site/docs/deploy-cloudflare.md, "Deploy every release with GitHub Actions").
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the version commit, tags and GitHub releases
      pull-requests: write # the Version Packages pull request
      id-token: write # npm trusted publishing (OIDC) and provenance: no npm token is stored
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      packages: ${{ steps.changesets.outputs.published-packages }}
      # the product's version moved: a package of the fixed group (.changeset/config.json) got its tag in this run
      product: >-
        ${{ steps.changesets.outputs.published == 'true' && (
        contains(steps.changesets.outputs.published-packages, '"@bongsu/core"') ||
        contains(steps.changesets.outputs.published-packages, '"@bongsu/api"') ||
        contains(steps.changesets.outputs.published-packages, '"@bongsu/cloudflare"') ||
        contains(steps.changesets.outputs.published-packages, '"@bongsu/web"') ||
        contains(steps.changesets.outputs.published-packages, '"@bongsu/dashboard"')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10, Node 24 ships npm 11. No registry-url: it
      # writes an .npmrc with a token placeholder that stands in the way of the OIDC exchange.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # The CLI is published as its bundle (packages/cli/build.mjs); the other packages publish nothing.
      - run: pnpm --filter bongsu build
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset version
          publish-script: sh scripts/release-publish.sh # the CLI with npm, then a git tag per new version
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      # One GitHub release per package, and GitHub marks the one created last as Latest (often @bongsu/schema): point
      # it at the CLI's release, else the product's (@bongsu/core).
      - if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          tag="$(jq -r 'map(select(.name == "bongsu" or .name == "@bongsu/core")) | sort_by(.name != "bongsu") | first
            | if . then "\(.name)@\(.version)" else empty end' <<<"$PACKAGES")"
          if [ -n "$tag" ]; then gh release edit "$tag" --latest -R "$GITHUB_REPOSITORY"; fi

  # The Node image (Dockerfile) at the product's version, when any package of the fixed group (.changeset/config.json)
  # got its tag in this run; they share @bongsu/core's version.
  docker:
    needs: release
    if: needs.release.outputs.product == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the product's version, from the commit being released (core may have been tagged by an earlier run)
      - id: version
        run: echo "version=$(jq -r .version packages/core/package.json)" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BONGSU_COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The instance's Cloudflare Workers at the released commit, where the repository turns it on (the variable
  # CLOUDFLARE_DEPLOY = true) and its `production` environment holds the values: secrets, so a public repository's logs
  # show them as ***. Required reviewers on that environment make the job wait for an approval.
  deploy-cloudflare:
    needs: release
    if: needs.release.outputs.product == 'true' && vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    concurrency:
      group: deploy-cloudflare
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # the templates' placeholders replaced in both configs; one left over (a secret not set) stops the deploy
      - name: Write the wrangler configs
        working-directory: apps/cloudflare
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: |
          for v in D1_DATABASE_ID PUBLIC_URL VAPID_PUBLIC_KEY VAPID_SUBJECT; do
            [ -n "${!v}" ] || { echo "the production environment has no $v secret" >&2; exit 1; }
          done
          case "$DRY_RUN" in 0 | 1) ;; *) echo "the production environment's DRY_RUN is 0 or 1" >&2; exit 1 ;; esac
          host="${PUBLIC_URL#https://}"
          host="${host%%/*}"
          # The secrets are masked in the log, but wrangler also prints values made from them: the hostname (RP_ID), the
          # Workers' addresses on the same domain (bongsu-cron.<sub>.workers.dev) and the VAPID key cut to 37 characters.
          echo "::add-mask::$host"
          echo "::add-mask::${host#*.}"
          echo "::add-mask::${VAPID_PUBLIC_KEY:0:37}"
          for f in wrangler.toml wrangler.cron.toml; do
            sed -i \
              -e "s|00000000-0000-0000-0000-000000000000|$D1_DATABASE_ID|" \
              -e "s|^PUBLIC_URL = \"https://bongsu.example.com\"|PUBLIC_URL = \"$PUBLIC_URL\"|" \
              -e "s|^RP_ID = \"bongsu.example.com\"|RP_ID = \"$host\"|" \
              -e "s|REPLACE_WITH_YOUR_VAPID_PUBLIC_KEY|$VAPID_PUBLIC_KEY|" \
              -e "s|mailto:owner@example.com|$VAPID_SUBJECT|" \
              -e "s|^DRY_RUN = \"1\"|DRY_RUN = \"$DRY_RUN\"|" \
              "$f"
            if grep -nE '0{8}-0{4}|example\.com|REPLACE_WITH' "$f"; then echo "$f: a value is missing" >&2; exit 1; fi
          done
      - name: Apply the migrations
        working-directory: apps/cloudflare
        run: pnpm exec wrangler d1 migrations apply bongsu --remote
      - name: Deploy both Workers
        working-directory: apps/cloudflare
        run: pnpm run deploy
      # tables there and no secret missing; `ok` waits for a media store, so it isn't required
      - name: Check /health
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        run: |
          curl -sS "$PUBLIC_URL/health" >health.json
          jq -e '(.missing_secrets | length == 0) and (.tables | length > 0)' health.json
