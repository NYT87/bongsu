<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bongsu">
  <!-- Bongsu small mark: the full mark (mark.svg) redrawn for 16–32 px, on a 64-unit grid with the tile's margins
       built in. Two peaks, the lit point at the summit, two signal rings; no smoke, no inner ridges. -->
  <defs>
    <linearGradient id="ember" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e85d1c"/>
      <stop offset="0.55" stop-color="#f7931e"/>
      <stop offset="1" stop-color="#fdab1a"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#ember)" stroke-width="4.6">
    <path stroke-linejoin="miter" stroke-miterlimit="10" d="M9 54L30 32L41 43L46 38L57 54Z"/>
    <path stroke-linecap="round" d="M28.44 13.14A9 9 0 0 1 38.97 22.78"/>
    <path stroke-linecap="round" d="M24.36 6.5A16.5 16.5 0 0 1 44.95 28.97"/>
  </g>
  <circle cx="30" cy="22" r="4" fill="#fdab1a"/>
</svg>
