# Git hooks, installed by `pnpm install` (lefthook). Skip once with LEFTHOOK=0 git commit … (CI still checks).
pre-commit:
  commands:
    biome:
      glob: "*.{js,ts,tsx,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
