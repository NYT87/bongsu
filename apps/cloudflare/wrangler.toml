# bongsu: the owner's app, the agent API (/v1, /mcp) and the media links. The cron runs in
# bongsu-cron (wrangler.cron.toml). Secrets: `bongsu deploy-secrets` (never here).
name = "bongsu"
main = "src/index.ts"
compatibility_date = "2026-08-20"   # the test runtime (vitest pool 0.22) supports up to 2026-08-22
workers_dev = true

[vars]
DRY_RUN = "1"   # "1": every step logs and notifies instead of publishing. Set "0" to go live.
PUBLIC_URL = "https://bongsu.example.com"
RP_ID = "bongsu.example.com"   # the app's passkeys (WebAuthn relying party)
VAPID_PUBLIC_KEY = "REPLACE_WITH_YOUR_VAPID_PUBLIC_KEY"   # Web Push (public by design)
VAPID_SUBJECT = "mailto:owner@example.com"

[[d1_databases]]
binding = "DB"
database_name = "bongsu"
database_id = "00000000-0000-0000-0000-000000000000"   # `wrangler d1 create bongsu` prints it
migrations_dir = "../../migrations/sqlite"

# No cron here: the scheduler's tick runs in the small `bongsu-cron` Worker (wrangler.cron.toml, src/cron.ts).
[triggers]
crons = []

# The owner's app (packages/web, built to dist/ by `pnpm build` there). The Worker runs first for its own routes;
# everything else is a static file, else index.html (single-page app).
[assets]
directory = "../../packages/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/app-api/*", "/admin-api/*", "/dashboard", "/dashboard/*", "/v1/*", "/mcp", "/m/*", "/health"]

# Workers Logs: the runs' console output kept a few days on the free plan, readable in the dashboard
# (Workers → this Worker → Logs) or with the observability API. Everything is logged (head_sampling_rate 1).
[observability]
enabled = true
head_sampling_rate = 1
