# Checks on every push and merge request; releases on main. No deploy: deployments use their own private configuration.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never # the merge request pipeline covers it
    - if: $CI_COMMIT_BRANCH

stages: [check, release]

default:
  image: node:22
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store/]

variables:
  npm_config_store_dir: .pnpm-store

check:
  stage: check
  script:
    - pnpm exec biome ci .
    - pnpm typecheck
    - pnpm test
    - pnpm test:site
    - pnpm site
    - pnpm build

# Conventional Commits (commitlint.config.js): every commit of a merge request, its title (used when squashing), and
# the commits of a push to a branch.
commitlint:
  stage: check
  variables:
    GIT_DEPTH: 0
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        pnpm exec commitlint --from "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --to "$CI_COMMIT_SHA" --verbose
        echo "$CI_MERGE_REQUEST_TITLE" | pnpm exec commitlint --verbose
      elif [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        pnpm exec commitlint --from "$CI_COMMIT_BEFORE_SHA" --to "$CI_COMMIT_SHA" --verbose
      else
        pnpm exec commitlint --last --verbose
      fi

# Comments on the merge request whether it has a changeset (and how to add one). Needs GITLAB_TOKEN.
changeset-comment:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $GITLAB_TOKEN
  script:
    - pnpm changesets-gitlab comment

# On main: with pending changesets, opens or updates the "Version Packages" merge request (versions + CHANGELOG.md
# per package); once that is merged, tags the new versions. Needs GITLAB_TOKEN (a project access token, role
# Maintainer, scopes api + write_repository), set as a masked CI/CD variable.
release:
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITLAB_TOKEN
  variables:
    INPUT_VERSION_SCRIPT: pnpm changeset version
    INPUT_PUBLISH_SCRIPT: pnpm changeset publish # private packages: no npm publish, only the git tags
    INPUT_PUSH_GIT_TAGS: "true"
    INPUT_PR_TITLE: "chore(release): version packages"
    INPUT_COMMIT_MESSAGE: "chore(release): version packages"
    INPUT_REMOVE_SOURCE_BRANCH: "true"
  script:
    - pnpm changesets-gitlab

# The project site (site/) on GitLab Pages: static files, separate from the Workers; nothing on it calls the API.
pages:
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - sh scripts/build-site.sh public
  artifacts:
    paths: [public]
